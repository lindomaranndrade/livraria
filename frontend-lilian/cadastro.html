<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livraria — Cadastrar livro</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="card">
    <h1>Cadastrar <span class="brand">livro</span></h1>
    <p class="subtitle">O identificador (ID) é gerado automaticamente pelo banco de dados — não é preenchido aqui.</p>

    <form id="formCadastro">
      <label for="titulo">Título</label>
      <input type="text" id="titulo" name="titulo" required>

      <label for="autor">Autor</label>
      <input type="text" id="autor" name="autor" required>

      <label for="editora">Editora</label>
      <input type="text" id="editora" name="editora" required>

      <label for="ano">Ano</label>
      <input type="number" id="ano" name="ano" required>

      <div class="form-actions">
        <button type="submit" id="btnCadastrarLivro" class="btn-primary">Cadastrar</button>
        <button type="button" id="btnVoltar" class="btn-outline" onclick="window.location.href='index.html'">Voltar</button>
      </div>
    </form>

    <div id="mensagem"></div>
  </div>

  <script src="js/cadastro.js"></script>
</body>
</html>
